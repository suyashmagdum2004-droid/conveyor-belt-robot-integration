<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Simple polyester belt conveyor with stepper motor and direct coupling</title>
  <desc id="desc">A simple compact conveyor: a red polyester belt loops around two end rollers on a basic support frame. A stepper motor on the left connects to the drive roller shaft through a coupling.</desc>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#222">Simple Conveyor Layout</text>
  <!-- rollers and belt loop -->
  <circle cx="250" cy="195" r="66" fill="#d6d6d6" stroke="#333" stroke-width="4"/>
  <circle cx="750" cy="195" r="66" fill="#d6d6d6" stroke="#333" stroke-width="4"/>
  <path d="M250 129 H750 A66 66 0 0 1 750 261 H250 A66 66 0 0 1 250 129 Z" fill="#d83b35" stroke="#333" stroke-width="3"/>
  <circle cx="250" cy="195" r="13" fill="#777" stroke="#333" stroke-width="3"/>
  <circle cx="750" cy="195" r="13" fill="#777" stroke="#333" stroke-width="3"/>
  <!-- simple support frame -->
  <path d="M250 274 V310 H750 V274 M330 310 V350 M670 310 V350 M290 350 H710" fill="none" stroke="#555" stroke-width="11" stroke-linejoin="round"/>
  <!-- motor and direct coupling -->
  <rect x="35" y="161" width="105" height="68" rx="8" fill="#64748b" stroke="#263238" stroke-width="4"/>
  <rect x="18" y="178" width="17" height="34" fill="#475569" stroke="#263238" stroke-width="3"/>
  <path d="M140 195 H164" stroke="#555" stroke-width="9"/>
  <rect x="164" y="181" width="42" height="28" rx="5" fill="#e0a33a" stroke="#333" stroke-width="3"/>
  <path d="M206 195 H237" stroke="#555" stroke-width="9"/>
  <!-- labels -->
  <g font-family="Arial,sans-serif" font-size="18" fill="#222">
    <text x="88" y="141" text-anchor="middle" font-weight="bold">Stepper motor</text>
    <text x="185" y="246" text-anchor="middle">Direct coupling</text>
    <path d="M185 229 V211" stroke="#333" stroke-width="2" fill="none"/>
    <text x="500" y="105" text-anchor="middle" font-weight="bold">Polyester belt</text>
    <path d="M500 109 V128" stroke="#333" stroke-width="2"/>
    <text x="250" y="391" text-anchor="middle">Drive roller</text>
    <path d="M250 373 V265" stroke="#333" stroke-width="2" fill="none"/>
    <text x="750" y="391" text-anchor="middle">Opposite roller</text>
    <path d="M750 373 V265" stroke="#333" stroke-width="2" fill="none"/>
    <text x="500" y="391" text-anchor="middle">Simple support frame</text>
    <path d="M500 373 V350" stroke="#333" stroke-width="2" fill="none"/>
  </g>
  <text x="500" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">Simplified explanatory schematic — not to scale or a manufacturing drawing.</text>
</svg>